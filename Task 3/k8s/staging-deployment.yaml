---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: staging
  labels:
    app: demo-app
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: demo-app
        environment: staging
    spec:
      containers:
        - name: demo-app
          image: REGISTRY_IMAGE:IMAGE_TAG   # replaced by CI pipeline
          ports:
            - containerPort: 3000
          env:
            - name: ENVIRONMENT
              value: "staging"
            - name: APP_VERSION
              value: "IMAGE_TAG"            # replaced by CI pipeline
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-svc
  namespace: staging
spec:
  selector:
    app: demo-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
