---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-review-SLUG        # SLUG replaced by CI
  namespace: review
  labels:
    app: demo-app
    environment: review
    review-slug: SLUG
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app-review-SLUG
  template:
    metadata:
      labels:
        app: demo-app-review-SLUG
        environment: review
    spec:
      containers:
        - name: demo-app
          image: REGISTRY_IMAGE:IMAGE_TAG
          ports:
            - containerPort: 3000
          env:
            - name: ENVIRONMENT
              value: "review-SLUG"
            - name: APP_VERSION
              value: "IMAGE_TAG"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-review-SLUG-svc
  namespace: review
spec:
  selector:
    app: demo-app-review-SLUG
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
