# =============================================================================
# .gitlab-ci.yml
# GitLab CI/CD – Multi-Stage Pipeline with Environments & Rollback
#
# Stages:  build → test → staging:deploy → production:deploy (manual)
# Extras:  rollback:staging (on failure), review apps (MR only),
#          DORA metrics job, Docker tags use pipeline ID / commit SHA (never 'latest')
# =============================================================================

# ---------------------------------------------------------------------------
# Global variables
# ---------------------------------------------------------------------------
variables:
  IMAGE_TAG: "${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"   # e.g. 12345-abc1def2  (never 'latest')
  REGISTRY_IMAGE: "${CI_REGISTRY_IMAGE}/demo-app"
  STAGING_NAMESPACE: "staging"
  PRODUCTION_NAMESPACE: "production"
  REVIEW_NAMESPACE: "review"
  KUBECTL_VERSION: "1.29.0"

# ---------------------------------------------------------------------------
# Stage ordering
# ---------------------------------------------------------------------------
stages:
  - build
  - test
  - staging:deploy
  - production:deploy
  - dora-metrics

# ---------------------------------------------------------------------------
# Reusable YAML anchors
# ---------------------------------------------------------------------------
.kubectl_setup: &kubectl_setup
  image: bitnami/kubectl:${KUBECTL_VERSION}
  before_script:
    # KUBECONFIG is stored as a GitLab CI/CD masked file variable
    - echo "${KUBECONFIG_B64}" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - kubectl version --client

.docker_setup: &docker_setup
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"

# =============================================================================
# STAGE: build
# =============================================================================
build:image:
  stage: build
  <<: *docker_setup
  script:
    - echo "Building image → ${REGISTRY_IMAGE}:${IMAGE_TAG}"
    - docker build
        --build-arg APP_VERSION="${IMAGE_TAG}"
        --label "ci.pipeline=${CI_PIPELINE_ID}"
        --label "ci.commit=${CI_COMMIT_SHORT_SHA}"
        --label "ci.ref=${CI_COMMIT_REF_NAME}"
        -t "${REGISTRY_IMAGE}:${IMAGE_TAG}"
        .
    # Also push a branch-name tag for traceability (never 'latest')
    - docker tag  "${REGISTRY_IMAGE}:${IMAGE_TAG}" "${REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}-latest"
    - docker push "${REGISTRY_IMAGE}:${IMAGE_TAG}"
    - docker push "${REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}-latest"
  artifacts:
    reports:
      dotenv: build.env   # exposes IMAGE_TAG to downstream jobs
  after_script:
    - echo "IMAGE_TAG=${IMAGE_TAG}" > build.env
    - echo "REGISTRY_IMAGE=${REGISTRY_IMAGE}" >> build.env

# =============================================================================
# STAGE: test
# =============================================================================
test:unit:
  stage: test
  image: node:18-alpine
  script:
    - cd app && npm install && npm test
  coverage: '/All tests passed/'   # simple coverage marker

test:container-scan:
  stage: test
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker pull "${REGISTRY_IMAGE}:${IMAGE_TAG}"
    - grype "${REGISTRY_IMAGE}:${IMAGE_TAG}" --fail-on high
  allow_failure: true   # advisory – won't block pipeline on OSS projects

# =============================================================================
# STAGE: staging:deploy
# =============================================================================
staging:deploy:
  stage: staging:deploy
  <<: *kubectl_setup
  environment:
    name: staging
    url: http://demo-app.staging.svc.cluster.local
    on_stop: staging:stop   # cleanup job reference
  script:
    - echo "Deploying ${IMAGE_TAG} to staging namespace '${STAGING_NAMESPACE}'"
    - kubectl create namespace "${STAGING_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
    # Substitute placeholders and apply manifests
    - sed -e "s|REGISTRY_IMAGE|${REGISTRY_IMAGE}|g"
          -e "s|IMAGE_TAG|${IMAGE_TAG}|g"
          k8s/staging-deployment.yaml | kubectl apply -n "${STAGING_NAMESPACE}" -f -
    # Wait for rollout; if it fails the rollback:staging job will trigger
    - kubectl rollout status deployment/demo-app -n "${STAGING_NAMESPACE}" --timeout=120s
    - echo "✅ Staging deploy successful – image ${IMAGE_TAG}"
  only:
    - main
    - develop

# Automated rollback – runs ONLY when staging:deploy fails
rollback:staging:
  stage: staging:deploy
  <<: *kubectl_setup
  when: on_failure           # ← triggered automatically on staging:deploy failure
  needs:
    - job: staging:deploy
      optional: true
  environment:
    name: staging
    action: prepare
  script:
    - echo "⚠️  staging:deploy failed – initiating rollback via kubectl rollout undo"
    - kubectl rollout undo deployment/demo-app -n "${STAGING_NAMESPACE}"
    - kubectl rollout status deployment/demo-app -n "${STAGING_NAMESPACE}" --timeout=90s
    - echo "✅ Rollback complete – previous revision restored"
  only:
    - main
    - develop

# Teardown helper (used by on_stop)
staging:stop:
  stage: staging:deploy
  <<: *kubectl_setup
  when: manual
  environment:
    name: staging
    action: stop
  script:
    - kubectl delete deployment demo-app -n "${STAGING_NAMESPACE}" --ignore-not-found
    - kubectl delete service  demo-app-svc -n "${STAGING_NAMESPACE}" --ignore-not-found

# =============================================================================
# STAGE: production:deploy  (MANUAL GATE)
# =============================================================================
production:deploy:
  stage: production:deploy
  <<: *kubectl_setup
  when: manual               # ← manual trigger = promotion gate
  environment:
    name: production
    url: http://demo-app.production.svc.cluster.local
  script:
    - echo "🚀 Promoting ${IMAGE_TAG} to production namespace '${PRODUCTION_NAMESPACE}'"
    - kubectl create namespace "${PRODUCTION_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
    - sed -e "s|REGISTRY_IMAGE|${REGISTRY_IMAGE}|g"
          -e "s|IMAGE_TAG|${IMAGE_TAG}|g"
          k8s/production-deployment.yaml | kubectl apply -n "${PRODUCTION_NAMESPACE}" -f -
    - kubectl rollout status deployment/demo-app -n "${PRODUCTION_NAMESPACE}" --timeout=180s
    - echo "✅ Production deploy successful – image ${IMAGE_TAG}"
  only:
    - main

rollback:production:
  stage: production:deploy
  <<: *kubectl_setup
  when: on_failure
  needs:
    - job: production:deploy
      optional: true
  environment:
    name: production
    action: prepare
  script:
    - echo "⚠️  production:deploy failed – initiating rollback"
    - kubectl rollout undo deployment/demo-app -n "${PRODUCTION_NAMESPACE}"
    - kubectl rollout status deployment/demo-app -n "${PRODUCTION_NAMESPACE}" --timeout=120s
    - echo "✅ Production rollback complete"
  only:
    - main

# =============================================================================
# REVIEW APPS  (Merge Requests only)
# =============================================================================
review:deploy:
  stage: staging:deploy
  <<: *kubectl_setup
  environment:
    name: review/${CI_COMMIT_REF_SLUG}
    url: http://demo-app-review-${CI_COMMIT_REF_SLUG}.review.svc.cluster.local
    on_stop: review:stop     # auto-stop when MR is merged/closed
    auto_stop_in: 1 day      # safety TTL
  script:
    - SLUG="${CI_COMMIT_REF_SLUG}"
    - echo "Deploying Review App for MR !${CI_MERGE_REQUEST_IID} → slug '${SLUG}'"
    - kubectl create namespace "${REVIEW_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
    - sed -e "s|REGISTRY_IMAGE|${REGISTRY_IMAGE}|g"
          -e "s|IMAGE_TAG|${IMAGE_TAG}|g"
          -e "s|SLUG|${SLUG}|g"
          k8s/review-deployment.yaml | kubectl apply -n "${REVIEW_NAMESPACE}" -f -
    - kubectl rollout status "deployment/demo-app-review-${SLUG}" -n "${REVIEW_NAMESPACE}" --timeout=90s
    - echo "✅ Review App live for ${SLUG}"
  only:
    - merge_requests

review:stop:
  stage: staging:deploy
  <<: *kubectl_setup
  when: manual
  environment:
    name: review/${CI_COMMIT_REF_SLUG}
    action: stop             # GitLab auto-triggers this on MR merge/close
  script:
    - SLUG="${CI_COMMIT_REF_SLUG}"
    - echo "Tearing down Review App for slug '${SLUG}'"
    - kubectl delete deployment "demo-app-review-${SLUG}" -n "${REVIEW_NAMESPACE}" --ignore-not-found
    - kubectl delete service    "demo-app-review-${SLUG}-svc" -n "${REVIEW_NAMESPACE}" --ignore-not-found
    - echo "✅ Review App removed"
  only:
    - merge_requests

# =============================================================================
# BONUS: DORA Metrics Job
# Calculates deployment frequency from the GitLab API and saves as artifact
# =============================================================================
dora:metrics:
  stage: dora-metrics
  image: alpine:3.19
  when: on_success
  needs:
    - job: production:deploy
      optional: true
  before_script:
    - apk add --no-cache curl jq
  script: |
    echo "=== DORA Metrics – Deployment Frequency ==="
    TODAY=$(date -u +%Y-%m-%dT00:00:00Z)
    THIRTY_DAYS_AGO=$(date -u -d '30 days ago' +%Y-%m-%dT00:00:00Z 2>/dev/null ||
                      date -u -v-30d +%Y-%m-%dT00:00:00Z)  # GNU / BSD compat

    # Fetch successful production deployments via GitLab Deployments API
    DEPLOYMENTS=$(curl --silent --fail \
      --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/deployments?environment=production&status=success&updated_after=${THIRTY_DAYS_AGO}&per_page=100" \
    )

    DEPLOY_COUNT=$(echo "${DEPLOYMENTS}" | jq '. | length')
    DEPLOY_FREQ=$(echo "scale=2; ${DEPLOY_COUNT} / 30" | bc)

    echo "Period:               last 30 days"
    echo "Total deployments:    ${DEPLOY_COUNT}"
    echo "Deployment frequency: ${DEPLOY_FREQ} deployments/day"
    echo "Pipeline ID:          ${CI_PIPELINE_ID}"
    echo "Triggered by:         ${GITLAB_USER_LOGIN}"
    echo "Timestamp:            $(date -u)"

    # Write structured report for the artifact
    cat > dora-metrics.json <<EOF
    {
      "report_generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
      "pipeline_id": "${CI_PIPELINE_ID}",
      "commit_sha": "${CI_COMMIT_SHORT_SHA}",
      "period_days": 30,
      "environment": "production",
      "total_deployments": ${DEPLOY_COUNT},
      "deployment_frequency_per_day": ${DEPLOY_FREQ},
      "dora_rating": $([ "$(echo "${DEPLOY_FREQ} > 1" | bc)" = "1" ] && echo '"Elite"' || echo '"High"')
    }
    EOF

    cat dora-metrics.json
  artifacts:
    name: "dora-metrics-${CI_PIPELINE_ID}"
    paths:
      - dora-metrics.json
    expire_in: 90 days
    reports:
      # Expose in the GitLab Deployments dashboard as a custom report
      metrics: dora-metrics.json
  only:
    - main
