global:
  resolve_timeout: 5m
  # webhook.site URL for testing - replace YOUR_WEBHOOK_ID with your webhook.site ID
  # Get a free URL at https://webhook.site
  http_config:
    follow_redirects: true

route:
  group_by: ['alertname', 'job']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: 'webhook-default'
  routes:
    - match:
        severity: critical
      receiver: 'webhook-critical'
      group_wait: 5s
      repeat_interval: 15m
    - match:
        severity: warning
      receiver: 'webhook-warning'

receivers:
  - name: 'webhook-default'
    webhook_configs:
      - url: 'https://webhook.site/${WEBHOOK_SITE_ID}'
        send_resolved: true
        http_config:
          follow_redirects: true
        max_alerts: 10

  - name: 'webhook-critical'
    webhook_configs:
      - url: 'https://webhook.site/${WEBHOOK_SITE_ID}'
        send_resolved: true
        http_config:
          follow_redirects: true
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'

  - name: 'webhook-warning'
    webhook_configs:
      - url: 'https://webhook.site/${WEBHOOK_SITE_ID}'
        send_resolved: true
        http_config:
          follow_redirects: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']
