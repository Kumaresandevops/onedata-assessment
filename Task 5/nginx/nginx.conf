user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Rate limiting zones
    # 10 requests/second per IP for API endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # 30 requests/second per IP for general traffic
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Rate limit status logging
    limit_req_status 429;
    limit_conn_status 429;

    upstream api_backend {
        server api:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint (no rate limiting)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Stub status for Prometheus nginx-exporter
        location /stub_status {
            stub_status on;
            access_log off;
            allow 172.0.0.0/8;
            allow 127.0.0.1;
            deny all;
        }

        # API routes with strict rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_log_level warn;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;

            # Rate limit response headers
            add_header X-RateLimit-Limit 10 always;
            add_header X-RateLimit-Policy "10r/s burst=20" always;
        }

        # Health endpoint proxy (relaxed rate limiting)
        location /health {
            limit_req zone=general_limit burst=50 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Root and other paths
        location / {
            limit_req zone=general_limit burst=50 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Custom error pages
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"rate_limit_exceeded","message":"Too many requests. Limit: 10 req/s for API endpoints.","retry_after":"1"}';
        }

        error_page 502 503 504 @upstream_error;
        location @upstream_error {
            default_type application/json;
            return 503 '{"error":"service_unavailable","message":"Backend service is temporarily unavailable."}';
        }
    }
}
