apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo-api
  namespace: default
  labels:
    app: cicd-demo-api
    version: "${IMAGE_TAG}"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-demo-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cicd-demo-api
        version: "${IMAGE_TAG}"
    spec:
      containers:
        - name: cicd-demo-api
          image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: ghcr-secret
